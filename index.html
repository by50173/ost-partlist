<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OST Part Catalog &amp; Orders</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#0d1830;          /* near-black navy ink */
  --green:#16419b;        /* brand blue (primary) */
  --green-dk:#113479;
  --green-wash:#eaf0fb;
  --gold:#d81f26;         /* brand red (accent) */
  --gold-wash:#fdecec;
  --paper:#f4f6fb;
  --card:#ffffff;
  --line:#e2e7f2;         /* hairline */
  --line-dk:#c8d0e0;
  --text:#17202e;
  --muted:#6b7488;
  --danger:#d81f26;
  --r:7px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--paper); color:var(--text); font-size:14.5px; line-height:1.45;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.hidden{display:none !important}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
svg{display:block}

/* ================= login ================= */
#loginScreen{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--ink);position:relative;overflow:hidden
}
#loginScreen::before{ /* industrial hazard band */
  content:"";position:absolute;left:0;right:0;bottom:0;height:64px;
  background:repeating-linear-gradient(-45deg,rgba(216,31,38,.30) 0 14px,transparent 14px 34px);
  border-top:1px solid rgba(216,31,38,.45);pointer-events:none
}
.login-card{
  width:100%;max-width:330px;background:var(--card);border-radius:10px;overflow:hidden;
  border:1px solid #000;position:relative;z-index:1
}
.login-head{background:var(--green);color:#fff;padding:20px 22px 18px;border-bottom:3px solid var(--gold)}
.login-mono{
  width:46px;height:46px;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:15px;letter-spacing:.08em;margin-bottom:14px
}
.login-head h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.login-head p{margin:5px 0 0;font-size:11.5px;color:rgba(255,255,255,.75);letter-spacing:.05em}
.login-body{padding:22px}
.field-lbl{color:var(--muted);margin-bottom:8px}
#pinInput{
  width:100%;padding:13px 14px;font-size:20px;letter-spacing:.5em;text-align:center;
  border:1.5px solid var(--line-dk);border-radius:var(--r);outline:none;background:#fbfcfb;
  font-family:ui-monospace,Consolas,monospace
}
#pinInput:focus{border-color:var(--green);background:#fff}
.btn-primary{
  width:100%;margin-top:14px;padding:14px;border-radius:var(--r);background:var(--green);
  color:#fff;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase
}
.btn-primary:active{background:var(--green-dk)}
.btn-primary:disabled{opacity:.55}
.err{margin-top:12px;color:var(--danger);font-size:12.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
.login-hint{margin-top:16px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}

/* ================= app frame ================= */
#appScreen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}

.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:0 14px;height:52px;background:var(--green);color:#fff;
  border-bottom:3px solid var(--gold);
  padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  font-weight:800;font-size:12px;letter-spacing:.1em;padding:5px 7px;
  border:1.5px solid rgba(255,255,255,.9);line-height:1
}
.brand-name{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.topbar-actions{display:flex;align-items:center;gap:8px}
.badge{
  font-size:9.5px;font-weight:800;letter-spacing:.14em;padding:4px 7px;
  border:1px solid rgba(255,255,255,.55);color:#fff
}
.badge.admin{background:var(--gold);border-color:var(--gold)}
.icon-btn{
  width:32px;height:32px;border:1px solid rgba(255,255,255,.35);display:flex;
  align-items:center;justify-content:center;color:#fff
}
.icon-btn:active{background:rgba(255,255,255,.15)}
.icon-btn svg{width:15px;height:15px}

/* ================= views / tabs ================= */
.view{flex:1;padding:16px 14px calc(64px + env(safe-area-inset-bottom))}
.search-wrap{position:relative;margin-bottom:4px}
.search-wrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}
#searchInput{
  width:100%;padding:12px 40px 12px 38px;font-size:14.5px;border:1.5px solid var(--line-dk);
  border-radius:var(--r);background:var(--card);outline:none
}
#searchInput:focus{border-color:var(--green)}
#searchInput::placeholder{color:#9aa3b0}
#clearSearch{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;color:var(--muted)
}
#clearSearch svg{width:13px;height:13px}
.result-info{color:var(--muted);margin:10px 1px 8px;display:flex;justify-content:space-between;gap:8px}
.result-info b{color:var(--ink)}

/* ================= inventory rows ================= */
.row-list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px;align-items:stretch
}
.row-thumb{
  position:relative;width:70px;height:70px;flex:none;border:1px solid var(--line);
  background:#eef1f6;overflow:hidden;border-radius:4px
}
.row-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.admin-row{position:absolute;top:3px;right:3px;display:flex;gap:3px}
.admin-btn{
  width:24px;height:24px;background:rgba(16,26,23,.82);color:#fff;display:flex;
  align-items:center;justify-content:center;border-radius:3px
}
.admin-btn:active{background:#000}
.admin-btn svg{width:13px;height:13px}
.admin-btn.danger{background:rgba(178,58,43,.9)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.row-no{font-size:13px;font-weight:700;color:var(--green);letter-spacing:.05em;word-break:break-all}
.row-name{
  font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word
}
.row-ctrl{width:86px;flex:none;display:flex;flex-direction:column;gap:6px;justify-content:center}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line-dk);border-radius:5px;overflow:hidden;background:#fbfcfb}
.stepper button{width:27px;height:30px;font-size:16px;font-weight:700;color:var(--green);line-height:1}
.stepper button:active{background:var(--green-wash)}
.stepper .qty{
  flex:1;text-align:center;font-size:13px;font-weight:700;
  border-left:1.5px solid var(--line-dk);border-right:1.5px solid var(--line-dk);
  line-height:30px;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums
}
.add-btn{
  border-radius:5px;background:var(--green);color:#fff;font-size:11px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;padding:8px 4px;
  display:flex;align-items:center;justify-content:center;gap:5px
}
.add-btn:active{background:var(--green-dk)}
.add-btn.added{background:var(--ink)}
.add-btn svg{width:11px;height:11px}

/* ================= empty / loading ================= */
.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty svg{width:38px;height:38px;margin:0 auto 14px;stroke-width:1.4}
.empty h3{margin:0 0 5px;color:var(--ink);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.empty p{margin:0;font-size:12.5px}

/* ================= cart ================= */
.cart-list{display:flex;flex-direction:column;gap:8px}
.cart-item{
  display:flex;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px;align-items:center
}
.cart-thumb{width:56px;height:56px;flex:none;border:1px solid var(--line);border-radius:4px;
  object-fit:cover;background:#eef1f6}
.cart-info{flex:1;min-width:0}
.cart-info .row-no{font-size:12.5px}
.cart-info .row-name{-webkit-line-clamp:2;font-size:12px}
.cart-ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rm-btn{font-size:10px;color:var(--danger);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.cart-summary{
  margin-top:14px;background:var(--ink);color:#fff;border-radius:var(--r);
  padding:13px 15px;display:flex;justify-content:space-between;align-items:center
}
.cart-summary .lbl{color:rgba(255,255,255,.65)}
.cart-summary b{font-size:17px;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.cart-actions{display:flex;gap:9px;margin-top:12px}
.btn-share{
  flex:1;padding:15px;border-radius:var(--r);background:var(--green);color:#fff;
  font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px
}
.btn-share:active{background:var(--green-dk)}
.btn-share:disabled{opacity:.55}
.btn-share svg{width:14px;height:14px}
.btn-ghost{
  padding:15px 16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line-dk);
  color:var(--danger);font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase
}
.cart-note{margin-top:10px;font-size:11px;color:var(--muted);text-align:center}

/* ================= order details (template fields) ================= */
.order-details{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 11px 12px}
.od-head{color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.od-head::after{content:"";flex:1;height:1px;background:var(--line)}
.od-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.od-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.od-field span{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.od-field input,.od-field select{
  width:100%;padding:8px 9px;font-size:13px;border:1.5px solid var(--line-dk);
  border-radius:5px;background:#fbfcfd;outline:none;color:var(--text);min-width:0
}
.od-field input:focus,.od-field select:focus{border-color:var(--green);background:#fff}
.od-field select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}

/* ================= tabbar ================= */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;z-index:20;
  display:flex;background:var(--card);border-top:1px solid var(--line-dk);
  padding-bottom:env(safe-area-inset-bottom)
}
.tab{
  flex:1;padding:11px 6px 10px;font-size:10px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);position:relative;display:flex;
  align-items:center;justify-content:center;gap:7px
}
.tab svg{width:16px;height:16px}
.tab.active{color:var(--green)}
.tab.active::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
.cart-badge{
  background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;min-width:17px;height:17px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;border-radius:3px;
  font-family:ui-monospace,Consolas,monospace
}

/* ================= viewer ================= */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,14,32,.93);display:flex;
  align-items:center;justify-content:center;padding:18px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.viewer-img{max-width:100%;max-height:76vh;object-fit:contain;background:#000}
.viewer-label{color:#fff;text-align:center;margin-top:12px;font-size:13px;letter-spacing:.06em}
.viewer-label small{display:block;font-weight:400;opacity:.6;font-size:11.5px;margin-top:3px}
.modal-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:38px;height:38px;
  border:1px solid rgba(255,255,255,.4);color:#fff;display:flex;align-items:center;justify-content:center}
.modal-close svg{width:15px;height:15px}

/* ================= share sheet ================= */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(8,14,32,.55)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:12px 12px 0 0;border-top:3px solid var(--gold);
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;
  animation:up .18s ease;max-height:86vh;overflow:auto
}
@keyframes up{from{transform:translateY(45%)}to{transform:translateY(0)}}
.sheet h3{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.sheet .sub{margin:5px 0 14px;font-size:12px;color:var(--muted)}
#shareText{
  width:100%;height:150px;border:1.5px solid var(--line-dk);border-radius:var(--r);padding:11px;
  font-size:12.5px;font-family:ui-monospace,Consolas,monospace;resize:none;outline:none;background:#fbfcfb
}
.share-row{display:flex;gap:8px;margin-top:12px}
.share-row a,.share-row button{
  flex:1;text-align:center;padding:12px 6px;border-radius:var(--r);font-size:11.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:6px
}
.sh-copy{background:var(--ink)}
.sh-share{background:#128c4a}
.sheet-actions{display:flex;gap:9px;margin-top:14px}
.sheet-actions .btn-primary{margin-top:0}

/* upload source picker (camera vs gallery) */
.src-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.src-btn{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:20px 8px;border:1.5px solid var(--line-dk);border-radius:var(--r);
  background:#fbfcfd;color:var(--text);font-size:11px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase
}
.src-btn:active{border-color:var(--green);background:var(--green-wash)}
.src-btn svg{width:26px;height:26px;color:var(--green);stroke-width:1.7}

/* ================= toast / loader ================= */
.toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:70;background:var(--ink);color:#fff;padding:10px 16px;border-radius:5px;font-size:12px;
  font-weight:700;letter-spacing:.06em;max-width:86%;text-align:center;animation:fade .18s;
  border-left:3px solid var(--gold)
}
.toast.err{border-left-color:var(--danger)}
#loader{position:fixed;inset:0;z-index:80;background:rgba(244,246,251,.7);
  display:flex;align-items:center;justify-content:center}
.spinner{
  width:40px;height:40px;border-radius:50%;border:3px solid var(--line-dk);
  border-top-color:var(--green);animation:spin .75s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ SCREEN 1 : ACCESS GATE ============ -->
<div id="loginScreen" class="screen">
  <div class="login-card">
    <div class="login-head">
      <div class="login-mono">OST</div>
      <h1>Part Catalog &amp; Orders</h1>
      <p>Authorised access only</p>
    </div>
    <div class="login-body">
      <div class="lbl field-lbl">Access PIN</div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="16"
             placeholder="&#8226;&#8226;&#8226;&#8226;" autocomplete="off" autocorrect="off" autocapitalize="off">
      <div id="loginError" class="err hidden"></div>
      <button id="loginBtn" class="btn-primary">Unlock</button>
      <div id="loginHint" class="login-hint"></div>
    </div>
  </div>
</div>

<!-- ============ SCREENS 2+3 : CATALOG + CART ============ -->
<div id="appScreen" class="screen hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">OST</span>
      <span class="brand-name">Part Catalog</span>
    </div>
    <div class="topbar-actions">
      <span id="roleBadge" class="badge">USER</span>
      <button id="refreshBtn" class="icon-btn" title="Refresh list" aria-label="Refresh list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="logoutBtn" class="icon-btn" title="Log out" aria-label="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- Catalog view -->
  <main id="catalogView" class="view">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="Search part no. or name…"
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <button id="clearSearch" class="hidden" title="Clear search" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="resultInfo" class="result-info lbl"></div>
    <div id="partList" class="row-list"></div>
    <div id="emptyState" class="empty hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <h3>No parts found</h3>
      <p id="emptyMsg">Try a different part number or name.</p>
    </div>
  </main>

  <!-- Cart view -->
  <main id="cartView" class="view hidden">
    <div id="cartEmpty" class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
      <h3>Cart is empty</h3>
      <p>Add parts from the catalog to build an order.</p>
    </div>
    <div id="cartContent" class="hidden">
      <div id="cartList" class="cart-list"></div>
      <div class="cart-summary">
        <span class="lbl">Total items</span><b id="cartTotal">0</b>
      </div>
      <div class="order-details">
        <div class="od-head lbl">Order details</div>
        <div class="od-grid">
          <label class="od-field"><span>Customer</span><input id="odCustomer" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Location</span><input id="odLocation" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Machine s/n</span><input id="odMachine" type="text" autocomplete="off"></label>
          <label class="od-field"><span>OMC Name</span><input id="odOmc" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Approved by</span><input id="odApproved" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Attention</span><input id="odAttention" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Send to</span><input id="odSendTo" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Send from</span><input id="odSendFrom" type="text" autocomplete="off"></label>
          <label class="od-field"><span>Refill</span><select id="odRefill"><option>No</option><option>Yes</option></select></label>
        </div>
      </div>
      <div class="cart-actions">
        <button id="clearCartBtn" class="btn-ghost">Clear</button>
        <button id="shareOrderBtn" class="btn-share">
          Generate order
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Tab bar -->
  <nav class="tabbar">
    <button class="tab active" data-tab="catalog">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>

<div id="toast" class="toast hidden"></div>
<div id="loader" class="hidden"><div class="spinner"></div></div>
<input type="file" id="fileInput" accept="image/*" class="hidden">

<script>
/* ============================================================
 *  OST Part Catalog & Order System - Frontend
 *  State is isolated per Telegram user in sessionStorage.
 * ============================================================ */

const API = 'https://script.google.com/macros/s/AKfycbzXl_CIY-ukiyG-hup3kr1-nH5ik3OB1sMh1dtgFgddj_Vmlsqegq4_92bqdf9KU3YMWw/exec';

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const USER_ID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
  ? String(tg.initDataUnsafe.user.id) : 'anon';
const USER_NAME = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
  ? [tg.initDataUnsafe.user.first_name, tg.initDataUnsafe.user.last_name].filter(Boolean).join(' ')
  : 'Customer';
const USER_USERNAME = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username)
  ? tg.initDataUnsafe.user.username : '';

/* --- per-user session storage (no mixed state between users) --- */
const SS = {
  k: (n) => 'ost_' + USER_ID + '_' + n,
  get(n, f) { try { const v = sessionStorage.getItem(this.k(n)); return v == null ? f : JSON.parse(v); } catch (e) { return f; } },
  set(n, v) { try { sessionStorage.setItem(this.k(n), JSON.stringify(v)); } catch (e) {} },
  clear(n) { try { sessionStorage.removeItem(this.k(n)); } catch (e) {} }
};

const state = {
  token: SS.get('token', null),
  role: SS.get('role', null),
  parts: SS.get('parts', []),
  cart: SS.get('cart', {}),          // { partNo: qty }
  query: '',
  tab: 'catalog',
  uploadPartNo: null
};

/* line-art placeholder for parts without an image */
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">' +
  '<rect width="200" height="200" fill="#eef1f6"/>' +
  '<g fill="none" stroke="#9aa3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M40 78l60-30 60 30-60 30-60-30z"/><path d="M40 78v44l60 30 60-30V78"/><path d="M100 108v44"/>' +
  '</g></svg>');

const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_CAM   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 8z"/><circle cx="12" cy="14" r="3.4"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 12.5h9L18 7"/><path d="M10 10.5v6M14 10.5v6"/></svg>';

/* ---------------- tiny helpers ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let toastTimer;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}
function loader(on) { $('loader').classList.toggle('hidden', !on); }
function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(type); } catch (e) {} }

/* --- Transport ----------------------------------------------------------
 * Primary: google.script.run — used when this page is served by the same
 * Apps Script Web App (production). Same-origin by design, no CORS.
 * Fallback: plain fetch to the /exec URL (REST mode, e.g. local preview).
 * ----------------------------------------------------------------------- */
const RPC_NAME = {
  login: 'apiLogin',
  parts: 'apiParts',
  uploadImage: 'apiUploadImage',
  deleteImage: 'apiDeleteImage',
  notify: 'apiNotifyUse'
};

function serverCall(action, payload) {
  payload = payload || {};

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    const args = action === 'login' ? [payload.pin]
      : action === 'parts' ? [state.token]
      : action === 'uploadImage' ? [state.token, payload.partNo, payload.base64]
      : action === 'notify' ? [state.token, payload.user]
      : [state.token, payload.partNo];
    return new Promise(resolve => {
      const runner = google.script.run
        .withSuccessHandler(res => resolve(res || { ok: false, error: 'Empty response from server' }))
        .withFailureHandler(err => resolve({
          ok: false,
          error: (err && err.message) ? err.message : String(err)
        }));
      runner[RPC_NAME[action]](...args);
    });
  }

  const data = Object.assign({ action: action, token: state.token }, payload);
  if (action === 'parts') {
    return fetch(API + '?' + new URLSearchParams(data), { redirect: 'follow' }).then(r => r.json());
  }
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // simple request -> no CORS preflight
    body: JSON.stringify(data),
    redirect: 'follow'
  }).then(r => r.json());
}
function handleAuth(res) {
  if (res && res.ok) return true;
  if (res && res.auth) { forceLogout('Session expired. Please log in again.'); return false; }
  throw new Error(res && res.error ? res.error : 'Request failed');
}

/* ---------------- boot ---------------- */
function boot() {
  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor('#16419b'); tg.setBackgroundColor('#f4f6fb'); } catch (e) {}
  }
  $('loginHint').textContent = USER_NAME !== 'Customer' ? 'Signed in as ' + USER_NAME : '';

  if (state.token && state.role) {
    enterApp(false);
  } else {
    $('loginScreen').classList.remove('hidden');
    setTimeout(() => $('pinInput').focus(), 150);
  }
  bindEvents();
}

function bindEvents() {
  $('loginBtn').addEventListener('click', doLogin);
  $('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('logoutBtn').addEventListener('click', () => forceLogout('Logged out.'));
  $('refreshBtn').addEventListener('click', () => loadParts(true));
  $('searchInput').addEventListener('input', debounce(onSearch, 90));
  $('clearSearch').addEventListener('click', () => { $('searchInput').value = ''; onSearch(); $('searchInput').focus(); });

  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

  $('viewerClose').addEventListener('click', () => $('viewer').classList.add('hidden'));
  $('viewer').addEventListener('click', e => { if (e.target === $('viewer')) $('viewer').classList.add('hidden'); });

  $('clearCartBtn').addEventListener('click', clearCart);
  $('shareOrderBtn').addEventListener('click', shareOrder);
  $('copyBtn').addEventListener('click', copyShareText);
  $('nativeShareBtn').addEventListener('click', nativeShare);
  $('shareCloseBtn').addEventListener('click', () => $('shareSheet').classList.add('hidden'));

  $('fileInput').addEventListener('change', onFilePicked);
}

/* ---------------- SCREEN 1: login ---------------- */
async function doLogin() {
  const pin = $('pinInput').value.trim();
  const errBox = $('loginError');
  if (!pin) { errBox.textContent = 'Please enter your PIN'; errBox.classList.remove('hidden'); return; }

  errBox.classList.add('hidden');
  $('loginBtn').disabled = true;
  loader(true);
  try {
    const res = await serverCall('login', { pin: pin });
    if (!res.ok) {
      errBox.textContent = res.error || 'Incorrect PIN';
      errBox.classList.remove('hidden');
      haptic('rigid');
      return;
    }
    state.token = res.token;
    state.role = res.role;
    SS.set('token', res.token);
    SS.set('role', res.role);
    $('pinInput').value = '';
    haptic('medium');
    await enterApp(true);
  } catch (e) {
    errBox.textContent = 'Cannot reach server. Check your connection.';
    errBox.classList.remove('hidden');
  } finally {
    $('loginBtn').disabled = false;
    loader(false);
  }
}

function forceLogout(msg) {
  state.token = null; state.role = null; state.parts = [];
  SS.clear('token'); SS.clear('role'); SS.clear('parts');
  // wipe rendered state so the next session never flashes stale rows
  $('partList').innerHTML = '';
  $('cartList').innerHTML = '';
  $('resultInfo').textContent = '';
  $('emptyState').classList.add('hidden');
  $('searchInput').value = '';
  state.query = '';
  $('clearSearch').classList.add('hidden');
  $('appScreen').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');
  if (msg) { const b = $('loginError'); b.textContent = msg; b.classList.remove('hidden'); }
}

/* ---------------- SCREEN 2: catalog ---------------- */
async function enterApp(freshLogin) {
  $('loginScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');

  const badge = $('roleBadge');
  const isAdmin = state.role === 'admin';
  badge.textContent = isAdmin ? 'ADMIN' : 'USER';
  badge.className = 'badge' + (isAdmin ? ' admin' : '');

  renderCartBadge();
  switchTab('catalog');

  if (state.parts.length) renderParts();   // instant list from cache
  else { $('partList').innerHTML = ''; $('resultInfo').textContent = ''; }  // never show stale rows

  // Tell the owner who opened the app (name + @username) - fire-and-forget
  serverCall('notify', {
    user: { id: USER_ID, name: USER_NAME, username: USER_USERNAME }
  }).catch(() => {});

  await loadParts(freshLogin);             // refresh in background / on fresh login
}

async function loadParts(showLoader) {
  if (showLoader) loader(true);
  try {
    const res = await serverCall('parts', {});
    if (!handleAuth(res)) return;
    state.parts = res.parts || [];
    SS.set('parts', state.parts);
    renderParts();
    renderCart();
  } catch (e) {
    if (!state.parts.length) toast('Failed to load parts: ' + e.message, true);
    else toast('Refresh failed — showing cached list', true);
    renderParts();
  } finally {
    if (showLoader) loader(false);
  }
}

/* Search: case-insensitive, multi-keyword, fragment-friendly.
 * "bcc", "00003", "000", "003", "bc" all match BCC_00003 (symbols ignored);
 * part names match on any word: "rg7 roller" finds "Roller, RG7 Bucket Rubber Roller".
 * Every whitespace-separated keyword must match somewhere in PartNo + PartName. */
const normPart  = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const normWords = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function filteredParts() {
  const q = state.query.trim();
  if (!q) return state.parts;
  const tokens = q.toLowerCase().split(/\s+/).map(t => t.replace(/[^a-z0-9]+/g, '')).filter(Boolean);
  if (!tokens.length) return state.parts;   // query of symbols only -> show everything
  return state.parts.filter(p => {
    const hay = normPart(p.partNo) + ' ' + normWords(p.partName);
    return tokens.every(t => hay.includes(t));
  });
}

function onSearch() {
  const v = $('searchInput').value;
  state.query = v;
  $('clearSearch').classList.toggle('hidden', !v);
  renderParts();
}

function renderParts() {
  const list = $('partList');
  const rows = filteredParts();
  const isAdmin = state.role === 'admin';

  $('resultInfo').innerHTML = state.query
    ? '<b>' + rows.length + '</b> result(s) for &ldquo;' + esc(state.query) + '&rdquo;'
    : '<b>' + state.parts.length + '</b> part no(s) on file';

  $('emptyState').classList.toggle('hidden', rows.length > 0);
  if (!rows.length) {
    $('emptyMsg').textContent = state.parts.length
      ? 'Try a different part number or name.'
      : 'The PartList sheet is empty. Add parts in Google Sheets first.';
    list.innerHTML = '';
    return;
  }

  list.innerHTML = rows.map(p => {
    const img = p.imageLink ? esc(p.imageLink) : PLACEHOLDER;
    const inCart = !!state.cart[p.partNo];
    const adminBtns = isAdmin
      ? '<div class="admin-row">' +
          '<button class="admin-btn" data-up="' + esc(p.partNo) + '" title="Upload image" aria-label="Upload image">' + ICON_CAM + '</button>' +
          '<button class="admin-btn danger" data-del="' + esc(p.partNo) + '" title="Delete image" aria-label="Delete image">' + ICON_TRASH + '</button>' +
        '</div>'
      : '';
    return '' +
      '<div class="row">' +
        '<div class="row-thumb">' +
          '<img src="' + img + '" alt="' + esc(p.partName) + '" loading="lazy" data-fallback="' + (p.imageLink ? '1' : '') + '">' +
          adminBtns +
        '</div>' +
        '<div class="row-main">' +
          '<div class="row-no mono">' + esc(p.partNo) + '</div>' +
          '<div class="row-name">' + esc(p.partName || '—') + '</div>' +
        '</div>' +
        '<div class="row-ctrl">' +
          '<div class="stepper">' +
            '<button data-step="-1" aria-label="Decrease">&minus;</button>' +
            '<span class="qty">1</span>' +
            '<button data-step="1" aria-label="Increase">+</button>' +
          '</div>' +
          '<button class="add-btn' + (inCart ? ' added' : '') + '" data-add="' + esc(p.partNo) + '">' +
            (inCart ? ICON_CHECK + 'In cart' : 'Add') +
          '</button>' +
        '</div>' +
      '</div>';
  }).join('');

  // delegated events
  list.querySelectorAll('.row-thumb img').forEach(im => {
    im.addEventListener('error', () => { if (im.dataset.fallback) { im.src = PLACEHOLDER; im.dataset.fallback = ''; } });
    im.addEventListener('click', () => openViewer(im.getAttribute('src'), im.alt));
  });
  list.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const el = b.parentElement.querySelector('.qty');
    let v = parseInt(el.textContent, 10) + parseInt(b.dataset.step, 10);
    el.textContent = Math.max(1, Math.min(999, v));
    haptic('light');
  }));
  list.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    const qtyEl = b.parentElement.querySelector('.qty');
    const qty = qtyEl ? parseInt(qtyEl.textContent, 10) || 1 : 1;
    addToCart(b.dataset.add, qty);
  }));
  list.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => pickImage(b.dataset.up)));
  list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteImage(b.dataset.del)));
}

function openViewer(src, label) {
  $('viewerImg').src = src;
  $('viewerLabel').innerHTML = esc(label || '');
  $('viewer').classList.remove('hidden');
  haptic('light');
}

/* ---------------- cart ---------------- */
function addToCart(partNo, qty) {
  state.cart[partNo] = (state.cart[partNo] || 0) + qty;
  SS.set('cart', state.cart);
  haptic('medium');
  toast(qty + ' × ' + partNo + ' added');
  renderCartBadge();
  renderCart();
  renderParts();
}

function setCartQty(partNo, qty) {
  if (qty <= 0) delete state.cart[partNo];
  else state.cart[partNo] = qty;
  SS.set('cart', state.cart);
  renderCartBadge();
  renderCart();
  renderParts();
}

function clearCart() {
  state.cart = {};
  SS.set('cart', state.cart);
  renderCartBadge();
  renderCart();
  renderParts();
  toast('Cart cleared');
}

function cartItems() {
  return Object.keys(state.cart).map(no => {
    const p = state.parts.find(x => x.partNo === no) ||
              { partNo: no, partName: '', imageLink: '' };
    return Object.assign({}, p, { qty: state.cart[no] });
  });
}

function renderCartBadge() {
  const n = Object.keys(state.cart).reduce((s, k) => s + state.cart[k], 0);
  const b = $('cartBadge');
  b.textContent = n;
  b.classList.toggle('hidden', n === 0);
}

function renderCart() {
  const items = cartItems();
  $('cartEmpty').classList.toggle('hidden', items.length > 0);
  $('cartContent').classList.toggle('hidden', items.length === 0);
  if (!items.length) return;

  $('cartList').innerHTML = items.map(it =>
    '<div class="cart-item">' +
      '<img class="cart-thumb" src="' + (it.imageLink ? esc(it.imageLink) : PLACEHOLDER) + '">' +
      '<div class="cart-info">' +
        '<div class="row-no mono">' + esc(it.partNo) + '</div>' +
        '<div class="row-name">' + esc(it.partName || '—') + '</div>' +
      '</div>' +
      '<div class="cart-ctrl">' +
        '<div class="stepper">' +
          '<button data-cstep="-1" aria-label="Decrease">&minus;</button>' +
          '<span class="qty">' + it.qty + '</span>' +
          '<button data-cstep="1" aria-label="Increase">+</button>' +
        '</div>' +
        '<button class="rm-btn" data-rm="' + esc(it.partNo) + '">Remove</button>' +
      '</div>' +
    '</div>').join('');

  $('cartTotal').textContent = items.reduce((s, i) => s + i.qty, 0);

  $('cartList').querySelectorAll('[data-cstep]').forEach(b => b.addEventListener('click', () => {
    const no = b.closest('.cart-item').querySelector('[data-rm]').dataset.rm;
    setCartQty(no, (state.cart[no] || 0) + parseInt(b.dataset.cstep, 10));
    haptic('light');
  }));
  $('cartList').querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    setCartQty(b.dataset.rm, 0);
    toast('Removed from cart');
  }));
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('catalogView').classList.toggle('hidden', tab !== 'catalog');
  $('cartView').classList.toggle('hidden', tab !== 'cart');
  if (tab === 'cart') renderCart();
  window.scrollTo(0, 0);
}

/* ---------------- order text + share ---------------- */
/* WhatsApp-friendly template: *bold* labels, plain values.
 * Order-details fields are read live from the form (empty by default). */
const OD_FIELDS = ['odCustomer', 'odLocation', 'odMachine', 'odOmc',
                   'odApproved', 'odSendTo', 'odSendFrom', 'odAttention', 'odRefill'];

function odValue(id) { const el = $(id); return el ? el.value.trim() : ''; }

function buildOrderText() {
  const items = cartItems();

  const lines = [];
  lines.push('*Customer* : ' + odValue('odCustomer'));
  lines.push('*Location* : ' + odValue('odLocation'));
  lines.push('*Machine s/n* : ' + odValue('odMachine'));
  lines.push('*Parts name* :');
  lines.push('');
  items.forEach((it, i) => {
    const name = it.partName ? ' (' + it.partName + ')' : '';
    lines.push((i + 1) + '. ' + it.partNo + name + ' x' + it.qty);
  });
  lines.push('');
  lines.push('*OMC Name* : ' + odValue('odOmc'));
  lines.push('*Approved by* : ' + odValue('odApproved'));
  lines.push('*Send to* : ' + odValue('odSendTo'));
  lines.push('*Send from* : ' + odValue('odSendFrom'));
  lines.push('*Attention* : ' + odValue('odAttention'));
  lines.push('*Refill* : ' + odValue('odRefill'));
  return lines.join('\n');
}

async function shareOrder() {
  const items = cartItems();
  if (!items.length) { toast('Cart is empty', true); return; }

  haptic('medium');
  openShareSheet(buildOrderText());   // always show sheet: Copy + Share (app picker)
}

function openShareSheet(text) {
  $('shareText').value = text;
  $('shareSheet').classList.remove('hidden');
}

async function nativeShare() {
  const text = $('shareText').value;
  await copyShareText();                        // clipboard ready if WhatsApp opens empty
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  if (tg && tg.openLink) tg.openLink(url);      // leave the Telegram WebView into WhatsApp
  else window.open(url, '_blank', 'noopener');
  $('shareSheet').classList.add('hidden');
  toast('Opened WhatsApp — paste the text if it is empty');
}

async function copyShareText() {
  const text = $('shareText').value;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = $('shareText');
    ta.removeAttribute('readonly'); ta.select();
    document.execCommand('copy'); ta.setAttribute('readonly', '');
  }
  toast('Order text copied');
}

/* ---------------- admin: image upload / delete ---------------- */
function pickImage(partNo) {
  state.uploadPartNo = partNo;
  // Camera is not usable in this Telegram client: open the gallery directly.
  const f = $('fileInput');
  f.value = '';
  f.click();
  haptic('light');
}

const MAX_PHOTO_BYTES = 15 * 1024 * 1024;

function onFilePicked(e) {
  const file = e.target.files && e.target.files[0];
  const partNo = state.uploadPartNo;
  if (!file || !partNo) return;

  const name = (file.name || '').toLowerCase();
  if (/\.(heic|heif)$/.test(name) || /heic|heif/.test(file.type || '')) {
    toast('iPhone HEIC photos are not supported. Use a JPEG or PNG (iPhone: Settings > Camera > Formats > Most Compatible).', true);
    return;
  }
  const isImage = /^image\//.test(file.type || '') || /\.(jpe?g|png|webp|gif|bmp)$/.test(name);
  if (!isImage) { toast('Please choose a photo (JPEG or PNG).', true); return; }
  if (file.size > MAX_PHOTO_BYTES) { toast('Photo is over 15 MB. Choose a smaller one.', true); return; }

  toast('Preparing ' + partNo + '...');
  loader(true);
  fileToJpegBase64(file, 1280, 0.85)
    .then(base64 => { loader(false); uploadBase64(partNo, base64); })
    .catch(() => { loader(false); toast('This photo could not be read. Try a JPEG or PNG.', true); });
}

/* gallery pick -> resized JPEG -> Drive */
function uploadBase64(partNo, base64) {
  if (!partNo || !base64) return;
  loader(true);
  toast('Uploading ' + partNo + '...');
  serverCall('uploadImage', { partNo: partNo, base64: base64 })
    .then(res => {
      if (!handleAuth(res)) return;
      const p = state.parts.find(x => x.partNo === partNo);
      if (p) { p.imageLink = res.imageUrl; SS.set('parts', state.parts); }
      toast('Image updated for ' + partNo);
      haptic('success');
      renderParts();
    })
    .catch(err => toast('Upload failed: ' + err.message, true))
    .finally(() => loader(false));
}

function fileToJpegBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';                      // flatten transparency -> real JPEG
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality).split(',')[1]);
      } catch (e) { reject(e); }
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Cannot read image')); };
    img.src = url;
  });
}

function deleteImage(partNo) {
  if (!confirm('Delete the image for ' + partNo + '?')) return;
  loader(true);
  serverCall('deleteImage', { partNo: partNo })
    .then(res => {
      if (!handleAuth(res)) return;
      const p = state.parts.find(x => x.partNo === partNo);
      if (p) { p.imageLink = ''; SS.set('parts', state.parts); }
      toast('Image deleted for ' + partNo);
      renderParts();
    })
    .catch(err => toast('Delete failed: ' + err.message, true))
    .finally(() => loader(false));
}

/* ---------------- go ---------------- */
boot();
</script>
